<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#D4F36B"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GymSpot"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>GymSpot — Better, together</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="dropdowns.css"></head><body><aside class="brand"><strong>GymSpot</strong><h1>Find your people.<br>Build your momentum.</h1><p>Your next great session starts with a connection.</p><span>LOCAL DEMO · Your data stays in this browser</span></aside><div class="app"><header><a href="#home" class="wordmark">GymSpot</a><button id="theme-toggle" class="subtle" aria-label="Toggle light and dark theme">◐</button></header><main id="content"></main><div id="composer-slot"></div><nav id="nav" aria-label="Main navigation"></nav></div><div id="toast" role="status" aria-live="polite"></div><dialog id="workout-dialog"><form id="workout-form"><h2>Every session counts.</h2><label>Workout type<select name="type"><option>Strength</option><option>Running</option><option>Mobility</option><option>HIIT</option></select></label><label>Duration (minutes)<input name="minutes" type="number" min="1" max="600" value="45" required></label><label>Date<input name="date" type="date" required></label><div class="row"><button type="button" class="secondary" id="close-workout">Cancel</button><button class="primary">Log workout</button></div></form></dialog><script type="module" src="app.js"></script><script type="module" src="mobile.js"></script><script type="module" src="dropdowns.js"></script></body></html>
